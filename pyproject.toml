[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easyathome-bbt-daemon"
version = "0.1.0"
description = "Standalone Linux daemon that collects Easy@Home EBT-300 basal body temperature readings over Bluetooth"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "easyathome-ble>=0.2.4",
    "bleak>=2.1.1,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/home-health-hub/easyathome-bbt-daemon"

[project.scripts]
easyathome-bbt-daemon = "easyathome_bbt_daemon.cli:main"
easyathome-bbt-api = "easyathome_bbt_daemon.api:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easyathome_bbt_daemon"]
